name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  security-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # Fails if SRI hashes in index.html are stale or openpgp.min.js does not
      # match its pinned sha384 hash (tamper detection).
      - name: Verify Subresource Integrity
        run: npm run sri:check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test
